<!doctype html>
<html>
  <head>
    <title>PETRONAS - Corporate Hierarchy (Interactive) - Blue Theme</title>

    <!-- Poppins font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --blue-900: #6EAAD7;   /* Parent */
        --blue-700: #9FCBE7;   /* Subsidiary */
        --blue-200: #CFECF7;   /* Child */
        --bg: #F6FBFD;         /* Page background */
        --text: #000000;
        --shadow: 0 8px 22px rgba(110, 170, 215, 0.18);
        --radius: 12px;
        --font-sans: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      }

      html, body {
        height: 100%;
        margin: 0;
        background: linear-gradient(180deg, #fbfdff 0%, #ffffff 100%);
        font-family: var(--font-sans);
        color: var(--text);
      }

      .wrap { padding: 18px; box-sizing: border-box; height: 100vh; display: flex; flex-direction: column; gap: 12px; }

      #canvas {
        flex: 1;
        border-radius: 10px;
        background: linear-gradient(180deg, #fff 0%, #f7fbff 100%);
        position: relative;
        overflow: hidden;
      }
      svg { width: 100%; height: 100%; display: block; }

      .node-box { pointer-events: auto; }
      .node-rect {
        fill: var(--blue-200);
        stroke: var(--blue-700);
        stroke-width: 2;
        rx: 12;
        ry: 12;
        filter: drop-shadow(var(--shadow));
      }
      .node-title { font-weight: 600; font-size: 14px; text-anchor: start; fill: var(--text); }
      .node-sub { font-size: 12px; opacity: 0.85; text-anchor: start; fill: var(--text); }

      .centered text { text-anchor: middle; }

      .parent .node-rect { fill: var(--blue-900); stroke: var(--blue-900); }
      .parent .node-title, .parent .node-sub { fill: #fff; }
      .parent .node-title { font-size: 20px; }
      .parent .node-sub { font-size: 14px; opacity: 0.95; }

      .subsidiary .node-rect { fill: var(--blue-700); stroke: var(--blue-700); }
      .subsidiary .node-title { fill: #000; font-size: 16px; }
      .subsidiary .node-sub { font-size: 13px; opacity: 0.9; }

      .child .node-rect { fill: var(--bg); stroke: var(--blue-900); }
      .child .node-title { fill: var(--blue-900); text-anchor: start; font-size: 13px; }
      .child .node-sub { text-anchor: start; font-size: 12px; opacity: 0.85; }

      .connector {
        fill: none;
        stroke: #6EAAD7;
        stroke-width: 2;
      }
      .connector.trunk { stroke: #A9D2EA; }

      .tooltip {
        position: absolute;
        display: none;
        background: #ffffff;
        border-radius: 8px;
        padding: 10px;
        box-shadow: var(--shadow);
        max-width: 360px;
        border: 1px solid rgba(110, 170, 215, 0.10);
        font-size: 14px;
        pointer-events: none;
        z-index: 5;
      }
      .tooltip h4 { margin: 0 0 6px 0; font-size: 15px; }
      .tooltip p { margin: 0; font-size: 13px; line-height: 1.3; }

      /* Side panel (RIGHT) */
      .sidepanel {
        position: absolute;
        right: 12px;
        top: 12px;
        width: 420px;
        max-width: 44%;
        height: 86%;
        background: white;
        border-radius: 10px;
        box-shadow: var(--shadow);
        padding: 16px;
        display: none;
        overflow: auto;
        border: 1px solid rgba(110, 170, 215, 0.10);
        z-index: 10;
      }
      .sidepanel h3 { margin: 0 0 8px 0; font-size: 18px; }
      .sidepanel .close { position: absolute; right: 8px; top: 6px; cursor: pointer; }

      .link-btn{
        display:inline-block;
        padding:6px 10px;
        border-radius:6px;
        border:1px solid rgba(110,170,215,0.25);
        background:#fff;
        font-size:13px;
        margin-left:8px;
        cursor:pointer
      }

      .stakeholders a { text-decoration: none; }
      .stakeholders a:hover { text-decoration: underline; }

      @media (max-width: 700px) { .sidepanel { display: none !important; } }
    </style>
  </head>

  <body>
    <div class="wrap">
      <div id="canvas" role="application" aria-label="Corporate hierarchy diagram">
        <div id="tooltip" class="tooltip" role="dialog" aria-hidden="true"></div>

        <div id="sidepanel" class="sidepanel" aria-hidden="true">
          <button class="close" aria-label="Close panel" onclick="closePanel()">✕</button>
          <div id="panel-content"></div>
        </div>

        <svg id="svgRoot" viewBox="0 0 1200 760" preserveAspectRatio="xMidYMid meet" tabindex="0">
          <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#6EAAD7" />
            </marker>
          </defs>
          <g id="connectors"></g>
          <g id="nodes"></g>
        </svg>
      </div>
    </div>

    <script>
      /*************************************************************************
       * DATA
       *************************************************************************/
      const DATA = {
        parent: {
          id: "petronas",
          name: "PETRONAS",
          type: "Parent",
          link: "https://www.petronas.com",
          shareholders: "Government of Malaysia (100%)",
          financials: "Financials: FY2025 Revenue: RM320 Billion (~USD 72 Billion)",
        },

        subsidiaries: [
          {
            id: "petronas-malaysia",
            name: "PETRONAS Malaysia",
            type: "Subsidiary",
            link: "https://presales.businessbywire.com/appmeadg/businessnext/detail/Account?x=zp45x2336zwpgphjbxng4aem9n5pjpa8be9cv4hnnyn9vk25mkhq&mdi=-1",
            Shareholders: "PETRONAS (100%)",
            Financials: "Domestic upstream operations (Malaysia) • Basin/asset operations & partner coordination",
            KeyStakeholders: [
              { name: "Tan Sri Dato' Seri Mohd Bakke Salleh", role: "Chairman", link: "https://presales.businessbywire.com/appmeadg/businessnext/detail/Contact?x=6uxajv6x75sajr77xtllu3hzv4xn4bzggs687lms5mjheycwbl28gxhpaah64xdvarf4v8jqvhs3wp9u97mdwmrw99286lzzshvhaam9j2mzku6kdwl34tddspkcqr4yqttjx54yurq57d5tkp4au89yn7bq5dyy2hwzv8hfv2stwq35nez28uq5u9hlvr6t4p4lm7ypk5k6nxwrelb82dvt53d6tkakz8a3eha"},
              { name: "Patrick Robertson", role: "CEO", link: "https://presales.businessbywire.com/appmeadg/businessnext/detail/Contact?x=6uxajv6x75sajr77xtllu3hzv4xn4bzggs687lms5mjheycwbl28gxhpaah64xdvarf4v8jqvhs3wp9u97mdwmrw99286lzzshvhaam9j2mzku6kdwl34tddspkcqr4yqttjx54yurq57d5tkp4au89yn7bq5dyy2hwzv8hfv2stwq35nez28uq5u9hlvr6t5whvqey56nr9d3ckdbny24hfxug96295tb3lszq" }
            ],
            suppliers: [
              { id: "s1", name: "Offshore Engineering Partner", region: "Malaysia", desc: "Platform fabrication, brownfield upgrades, offshore maintenance", link: "#" }
            ],
            accounts: [
              { id: "a1", name: "XYZ Bank Malaysia", region: "Malaysia", desc: "Primary banking partner for treasury, payments, FX and liquidity", link: "#" }
            ],
            holdings: [
              { id: "h1", name: "Upstream Assets Portfolio", region: "Malaysia", desc: "Domestic fields, PSC interests, development projects & production hubs", link: "#" }
            ]
          },

          {
            id: "petronas-carigali",
            name: "PETRONAS Carigali Sdn Bhd",
            type: "Subsidiary",
            link: "https://www.petronas.com",
            Shareholders: "PETRONAS (100%)",
            Financials: "Upstream E&P arm • Exploration, development, production & international ventures",
            KeyStakeholders: [
              { name: "E&P Executive Leadership", role: "Management Team", link: "#" },
              { name: "Exploration & Development Head", role: "Exploration / Development", link: "#" }
            ],
            suppliers: [
              { id: "s3", name: "Drilling Services Contractor", region: "Malaysia", desc: "Rig services, directional drilling, drilling fluids & completions", link: "#" },
              { id: "s4", name: "Seismic & Subsurface Partner", region: "Malaysia", desc: "Seismic acquisition/processing and interpretation support", link: "#" }
            ],
            accounts: [],
            holdings: [
              { id: "h2", name: "E&P Licenses & Blocks", region: "Malaysia / International", desc: "Operated/non-operated interests, exploration licenses and development assets", link: "#" }
            ]
          },

          {
            id: "petronas-chemicals",
            name: "PETRONAS Chemicals",
            type: "Subsidiary",
            link: "https://www.petronaschemicals.com",
            Shareholders: "PETRONAS (Majority Ownership)",
            Financials: "Listed petrochemicals arm • Olefins, derivatives, fertilizers & specialties",
            KeyStakeholders: [
              { name: "PCG Executive Management", role: "Leadership Team", link: "#" }
            ],
            suppliers: [],
            accounts: [],
            holdings: [
              { id: "h3", name: "Petrochemicals Complex", region: "Malaysia", desc: "Integrated petrochemicals production sites & value chain assets", link: "#" }
            ]
          }
        ]
      };

      /*************************************************************************
       * Layout configuration
       * Children are laid out in a dedicated column under each subsidiary,
       * stacked vertically. Column width + trunk offset always stays inside the
       * subsidiary's horizontal slot, so no two nodes can ever overlap.
       *************************************************************************/
      const cfg = {
        svgW: 1200,
        parentY: 50,
        subsidiaryY: 210,
        parentBox: { w: 340, h: 96 },
        subsidiaryBox: { w: 280, h: 84 },
        childBox: { w: 240, h: 62 },
        childGapY: 26,          // vertical gap between stacked children
        columnGutter: 60,       // minimum empty space between adjacent columns
        trunkOffset: 34,        // distance from column left edge to the vertical trunk
        subToChildGap: 70,      // vertical gap between a subsidiary and its first child
        bottomPadding: 50,
      };

      // Horizontal slot per subsidiary must fit: trunk + child box + gutter
      cfg.subsidiarySpacing = Math.max(
        cfg.subsidiaryBox.w + cfg.columnGutter,
        cfg.childBox.w + cfg.trunkOffset + cfg.columnGutter
      );

      const svg = document.getElementById("svgRoot");
      const nodesGroup = document.getElementById("nodes");
      const connGroup = document.getElementById("connectors");
      const tooltip = document.getElementById("tooltip");
      const sidepanel = document.getElementById("sidepanel");
      const panelContent = document.getElementById("panel-content");

      function collectChildren(sdata) {
        const out = [];
        (sdata.dealers   || []).forEach((d) => out.push({ data: d, kind: "Dealer" }));
        (sdata.suppliers || []).forEach((d) => out.push({ data: d, kind: "Supplier" }));
        (sdata.accounts  || []).forEach((d) => out.push({ data: d, kind: "Account" }));
        (sdata.holdings  || []).forEach((d) => out.push({ data: d, kind: "Holding" }));
        return out;
      }

      function render() {
        nodesGroup.innerHTML = "";
        connGroup.innerHTML = "";

        const nSubs = DATA.subsidiaries.length;

        // Canvas width grows if there are more subsidiaries than the base width holds
        const requiredW = nSubs * cfg.subsidiarySpacing + cfg.columnGutter;
        const svgW = Math.max(cfg.svgW, requiredW);
        const centerX = svgW / 2;

        // Parent
        const parentNode = {
          x: centerX - cfg.parentBox.w / 2,
          y: cfg.parentY,
          w: cfg.parentBox.w,
          h: cfg.parentBox.h,
          data: DATA.parent
        };

        // Subsidiaries evenly spaced, each owning an exclusive horizontal slot
        const totalSpan = (nSubs - 1) * cfg.subsidiarySpacing;
        const firstCenter = centerX - totalSpan / 2;

        const subsNodes = DATA.subsidiaries.map((s, i) => {
          const cx = firstCenter + i * cfg.subsidiarySpacing;
          return {
            x: cx - cfg.subsidiaryBox.w / 2,
            y: cfg.subsidiaryY,
            w: cfg.subsidiaryBox.w,
            h: cfg.subsidiaryBox.h,
            cx,
            data: s
          };
        });

        // Parent -> subsidiary connectors
        subsNodes.forEach((sub) => {
          drawOrthogonalConnector(
            { x: parentNode.x + parentNode.w / 2, y: parentNode.y + parentNode.h },
            { x: sub.cx, y: sub.y },
            "connector"
          );
        });

        drawNode(parentNode, "parent");

        const childStartY = cfg.subsidiaryY + cfg.subsidiaryBox.h + cfg.subToChildGap;
        let lowestY = childStartY;

        subsNodes.forEach((sub) => {
          drawNode(sub, "subsidiary");

          const children = collectChildren(sub.data);
          if (!children.length) return;

          const colX = sub.cx - cfg.childBox.w / 2 + cfg.trunkOffset / 2; // column left edge
          const trunkX = colX - cfg.trunkOffset;

          const placed = children.map((c, idx) => ({
            x: colX,
            y: childStartY + idx * (cfg.childBox.h + cfg.childGapY),
            w: cfg.childBox.w,
            h: cfg.childBox.h,
            data: c.data,
            kind: c.kind
          }));

          const lastMidY = placed[placed.length - 1].y + cfg.childBox.h / 2;
          lowestY = Math.max(lowestY, placed[placed.length - 1].y + cfg.childBox.h);

          // One shared trunk: down from the subsidiary, across, then down the column
          drawPolyline([
            [sub.cx, sub.y + sub.h],
            [sub.cx, sub.y + sub.h + cfg.subToChildGap / 2],
            [trunkX, sub.y + sub.h + cfg.subToChildGap / 2],
            [trunkX, lastMidY]
          ], "connector trunk", false);

          // Short stubs from the trunk into each child's left edge
          placed.forEach((c) => {
            const midY = c.y + c.h / 2;
            drawPolyline([[trunkX, midY], [c.x, midY]], "connector", true);
            drawNode(c, "child", c.kind);
          });
        });

        const svgH = lowestY + cfg.bottomPadding;
        svg.setAttribute("viewBox", `0 0 ${svgW} ${svgH}`);
      }

      function drawNode(nodeObj, variant, kind) {
        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        g.classList.add("node-box");
        if (variant) g.classList.add(variant);
        if (variant === "parent" || variant === "subsidiary") g.classList.add("centered");

        const { x, y, w, h } = nodeObj;

        const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        rect.setAttribute("x", x); rect.setAttribute("y", y);
        rect.setAttribute("width", w); rect.setAttribute("height", h);
        rect.setAttribute("rx", 12); rect.setAttribute("ry", 12);
        rect.classList.add("node-rect");
        g.appendChild(rect);

        const centered = g.classList.contains("centered");
        const titleY = centered ? y + h / 2 - 4 : y + 26;
        const subY = centered ? y + h / 2 + 20 : y + 46;

        const title = document.createElementNS("http://www.w3.org/2000/svg", "text");
        title.setAttribute("x", centered ? x + w / 2 : x + 14);
        title.setAttribute("y", titleY);
        title.setAttribute("class", "node-title");
        title.textContent = nodeObj.data.name;
        g.appendChild(title);

        const subtitle = document.createElementNS("http://www.w3.org/2000/svg", "text");
        subtitle.setAttribute("x", centered ? x + w / 2 : x + 14);
        subtitle.setAttribute("y", subY);
        subtitle.setAttribute("class", "node-sub");
        if (variant === "parent") subtitle.textContent = nodeObj.data.type || "Parent";
        else if (variant === "subsidiary") subtitle.textContent = nodeObj.data.type || "Subsidiary";
        else subtitle.textContent = kind || "";
        g.appendChild(subtitle);

        // Keep long labels inside their box
        fitText(title, w - (centered ? 24 : 28));

        const overlay = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        overlay.setAttribute("x", x); overlay.setAttribute("y", y);
        overlay.setAttribute("width", w); overlay.setAttribute("height", h);
        overlay.setAttribute("fill", "transparent"); overlay.setAttribute("tabindex", "0");
        const labelParts = [nodeObj.data.name, variant]; if (kind) labelParts.push(kind);
        overlay.setAttribute("aria-label", labelParts.join(" "));
        overlay.style.cursor = "pointer";

        overlay.addEventListener("mouseenter", (ev) => showTooltip(nodeObj, ev));
        overlay.addEventListener("mouseleave", hideTooltip);
        overlay.addEventListener("focus", (ev) => showTooltip(nodeObj, ev));
        overlay.addEventListener("blur", hideTooltip);
        overlay.addEventListener("click", () => openPanel(nodeObj, variant, kind));
        overlay.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") { openPanel(nodeObj, variant, kind); e.preventDefault(); }
        });

        g.appendChild(overlay);
        nodesGroup.appendChild(g);
      }

      // Shrink a label a little rather than letting it spill outside its box
      function fitText(textEl, maxWidth) {
        try {
          const base = parseFloat(window.getComputedStyle(textEl).fontSize) || 14;
          let size = base;
          while (textEl.getComputedTextLength() > maxWidth && size > 9) {
            size -= 0.5;
            textEl.setAttribute("font-size", size + "px");
          }
        } catch (e) { /* getComputedTextLength unavailable before layout */ }
      }

      function drawPolyline(points, cls, withArrow) {
        const poly = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
        poly.setAttribute("points", points.map((p) => p.join(",")).join(" "));
        poly.setAttribute("class", cls);
        poly.setAttribute("fill", "none");
        poly.setAttribute("stroke-linecap", "round");
        poly.setAttribute("stroke-linejoin", "round");
        if (withArrow) poly.setAttribute("marker-end", "url(#arrow)");
        connGroup.appendChild(poly);
      }

      function drawOrthogonalConnector(from, to, cls) {
        const midY = (from.y + to.y) / 2;
        drawPolyline([
          [from.x, from.y], [from.x, midY], [to.x, midY], [to.x, to.y]
        ], cls, true);
      }

      function showTooltip(nodeObj, ev) {
        const d = nodeObj.data;
        const type = (d.type || "").toLowerCase();
        const isParent = type.includes("parent");
        const isSubs = type.includes("subsidiary");

        let html = "";
        if (isParent || isSubs) {
          html += `<h4>${escapeHtml(d.name)}</h4>`;
          html += `<p><strong>Shareholders:</strong> ${escapeHtml(d.shareholders || d.Shareholders || "—")}</p>`;
          html += `<p><strong>Financials:</strong> ${escapeHtml(d.financials || d.Financials || "—")}</p>`;
        } else {
          html += `<h4>${escapeHtml(d.name)}</h4>`;
          html += `<p><strong>Type:</strong> ${escapeHtml(ev.target.getAttribute("aria-label") || "")}</p>`;
          html += `<p><strong>Region:</strong> ${escapeHtml(d.region || "—")}</p>`;
          html += `<p>${escapeHtml(d.desc || "")}</p>`;
        }

        tooltip.innerHTML = html;
        tooltip.style.display = "block";
        tooltip.setAttribute("aria-hidden", "false");

        const rect = document.getElementById("canvas").getBoundingClientRect();
        const box = ev.target.getBoundingClientRect();
        let pageX = ev.clientX || (box.left + box.width / 2);
        let pageY = ev.clientY || (box.top + box.height / 2);

        const offsetX = 14, offsetY = 10;
        tooltip.style.left = Math.max(8, Math.min(pageX - rect.left + offsetX, rect.width - 360)) + "px";
        tooltip.style.top = Math.max(8, Math.min(pageY - rect.top + offsetY, rect.height - 120)) + "px";
      }

      function hideTooltip() {
        tooltip.style.display = "none";
        tooltip.setAttribute("aria-hidden", "true");
      }

      function openPanel(nodeObj, variant, kind) {
        sidepanel.style.display = "block";
        sidepanel.setAttribute("aria-hidden", "false");
        panelContent.innerHTML = buildPanelHtml(nodeObj.data, variant, kind);
      }
      function closePanel() {
        sidepanel.style.display = "none";
        sidepanel.setAttribute("aria-hidden", "true");
      }

      /*************************************************************************
       * PANEL HTML
       *************************************************************************/
      function buildPanelHtml(data, variant, kind) {

        if (variant === "parent" || (data.type && data.type.toLowerCase().includes("parent"))) {
          let html = `<h3 style="margin-bottom:14px">${escapeHtml(data.name)}</h3>`;
          html += `<p><strong>Type:</strong> Parent</p>`;
          html += `<p><strong>Shareholders:</strong> ${escapeHtml(data.shareholders || data.Shareholders || "—")}</p>`;
          html += `<p><strong>Financials:</strong> ${escapeHtml(data.financials || data.Financials || "—")}</p>`;
          if (data.link) {
            html += `<hr style="border:none;border-top:1px solid rgba(0,0,0,0.15);margin:14px 0;">`;
            html += `<p style="opacity:.85;font-size:13px;margin:0">Actions:
              <button class="link-btn" onclick="window.open('${escapeJs(data.link)}','_blank')">View profile</button>
            </p>`;
          }
          return html;
        }

        if (variant === "subsidiary" || (data.type && data.type.toLowerCase().includes("subsidiary"))) {
          let html = `<h3 style="margin-bottom:14px">${escapeHtml(data.name)}</h3>`;

          html += `<p><strong>Type:</strong> Subsidiary</p>`;
          html += `<p><strong>Shareholders:</strong> ${escapeHtml(data.Shareholders || data.shareholders || "—")}</p>`;
          html += `<p><strong>Financials:</strong> ${escapeHtml(data.Financials || data.financials || "—")}</p>`;

          html += `<hr style="border:none;border-top:1px solid rgba(0,0,0,0.15);margin:14px 0;">`;

          const stakeholders = data.KeyStakeholders || data.keyStakeholders || [];
          html += `<div style="margin-bottom:14px"><strong>Key Stakeholders:</strong></div>`;
          if (stakeholders.length > 0) {
            html += `<ul class="stakeholders" style="margin:6px 0 0 18px;padding:0;">`;
            stakeholders.forEach((sh) => {
              const nm = escapeHtml(sh.name || "—");
              const role = sh.role ? ` - <span style="opacity:.85">${escapeHtml(sh.role)}</span>` : "";
              if (sh.link && sh.link !== "#") {
                html += `<li style="margin:6px 0;">
                  <a href="${escapeJs(sh.link)}" target="_blank" rel="noopener noreferrer" style="color:#1a73e8;">${nm}</a>${role}
                </li>`;
              } else {
                html += `<li style="margin:6px 0;">${nm}${role}</li>`;
              }
            });
            html += `</ul>`;
          } else {
            html += `<div style="opacity:.7;font-size:13px">—</div>`;
          }

          html += `<hr style="border:none;border-top:1px solid rgba(0,0,0,0.15);margin:14px 0;">`;
          html += `<div style="margin-bottom:10px"><strong>Linked entities</strong></div>`;

          const groups = [
            { title: "Suppliers", items: data.suppliers },
            { title: "Accounts", items: data.accounts },
            { title: "Holdings", items: data.holdings },
            { title: "Dealers", items: data.dealers },
          ];

          groups.forEach((group) => {
            const items = group.items || [];
            if (!items.length) return;

            html += `<div style="margin-top:14px">
              <div style="font-weight:700;margin-bottom:8px">${group.title}</div>`;

            items.forEach((item) => {
              html += `<div style="margin-bottom:12px">
                <div style="font-weight:700">${escapeHtml(item.name || "—")}</div>
                ${item.region ? `<div style="opacity:.85;font-size:13px">${escapeHtml(item.region)}</div>` : ``}
                ${item.desc ? `<div style="opacity:.75;font-size:13px">${escapeHtml(item.desc)}</div>` : ``}
              </div>`;
            });

            html += `</div>`;
          });

          if (data.link) {
            html += `<hr style="border:none;border-top:1px solid rgba(0,0,0,0.15);margin:14px 0;">`;
            html += `<p style="opacity:.85;font-size:13px;margin:0">Actions:
              <button class="link-btn" onclick="window.open('${escapeJs(data.link)}','_blank')">View profile</button>
            </p>`;
          }

          return html;
        }

        const childKind = kind || (data.kind ? data.kind : "Entity");
        let html = `<h3 style="margin-bottom:14px">${escapeHtml(data.name)}</h3>`;
        html += `<p><strong>Type:</strong> ${escapeHtml(childKind)}</p>`;
        if (data.region) html += `<p><strong>Region:</strong> ${escapeHtml(data.region)}</p>`;
        if (data.desc) html += `<p><strong>Description:</strong> ${escapeHtml(data.desc)}</p>`;

        if (data.link && data.link !== "#") {
          html += `<hr style="border:none;border-top:1px solid rgba(0,0,0,0.15);margin:14px 0;">`;
          html += `<p style="opacity:.85;font-size:13px;margin:0">Actions:
            <button class="link-btn" onclick="window.open('${escapeJs(data.link)}','_blank')">Open link</button>
          </p>`;
        }
        return html;
      }

      function escapeHtml(s) {
        if (s === undefined || s === null) return "";
        return String(s).replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;");
      }
      function escapeJs(s) {
        if (!s) return "";
        return String(s).replaceAll('"', '&quot;').replaceAll("'", "\\'");
      }

      render();

      window.refreshHierarchy = function (newData) {
        if (newData) Object.assign(DATA, newData);
        render();
      };

      window.addEventListener("resize", () => { hideTooltip(); });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") { hideTooltip(); closePanel(); }
      });
    </script>
  </body>
</html>
